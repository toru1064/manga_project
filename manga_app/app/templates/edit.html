<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171513">
    <title>投稿編集 | 漫画感想アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root { --ink:#171513; --muted:#6b655f; --paper:#f7f5f1; --white:#fff; --line:#e7e1d9; --accent:#ff5c35; --accent-pale:#fff0eb; --yellow:#ffbd2e; --shadow:0 18px 45px rgba(46,35,28,.08); }
        * { box-sizing:border-box; }
        body { min-width:320px; margin:0; color:var(--ink); background:radial-gradient(circle at 8% 0%,rgba(255,92,53,.09),transparent 26rem),var(--paper); font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif; line-height:1.7; }
        button,input,textarea { font:inherit; }
        .header-inner,.page-wrap { width:min(920px,calc(100% - 40px)); margin:0 auto; }
        .app-header { position:sticky; top:0; z-index:1000; border-bottom:1px solid rgba(23,21,19,.08); background:rgba(247,245,241,.9); backdrop-filter:blur(18px); }
        .header-inner { min-height:76px; display:flex; align-items:center; gap:30px; }
        .brand { display:inline-flex; align-items:center; gap:11px; flex:0 0 auto; color:var(--ink); text-decoration:none; font-size:1.05rem; font-weight:900; letter-spacing:-.04em; }
        .brand-mark { width:38px; height:38px; display:grid; place-items:center; border-radius:12px 12px 12px 4px; color:var(--white); background:var(--accent); box-shadow:4px 4px 0 var(--ink); font-family:Georgia,serif; font-size:1.3rem; }
        .main-nav { display:flex; align-items:center; gap:5px; min-width:0; }
        .nav-item-custom { padding:8px 12px; border-radius:999px; color:var(--muted); text-decoration:none; white-space:nowrap; font-size:.86rem; font-weight:800; transition:.2s ease; }
        .nav-item-custom:hover,.nav-item-custom.active { color:var(--ink); background:var(--white); box-shadow:0 4px 18px rgba(46,35,28,.07); }
        .header-actions { display:flex; align-items:center; gap:9px; margin-left:auto; flex:0 0 auto; }
        .new-post,.logout { min-height:40px; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; text-decoration:none; font-size:.84rem; font-weight:900; transition:.2s ease; }
        .new-post { gap:7px; padding:8px 18px; color:var(--white); background:var(--ink); }
        .new-post::before { content:"+"; color:var(--yellow); font-size:1.15rem; line-height:1; }
        .new-post:hover { color:var(--white); background:#302c28; }
        .logout { padding:8px 13px; color:var(--muted); border:1px solid var(--line); }

        .page-wrap { padding:52px 0 85px; }
        .page-heading { display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:25px; }
        .eyebrow { margin:0 0 4px; color:var(--accent); font-size:.7rem; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
        h1 { margin:0; font-size:clamp(2rem,5vw,3.15rem); font-weight:900; letter-spacing:-.06em; }
        .back-link { padding:9px 15px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:var(--white); text-decoration:none; font-size:.78rem; font-weight:800; transition:.2s ease; }
        .back-link:hover { color:var(--ink); border-color:#bbb2a8; }

        .edit-card { overflow:hidden; border:1px solid var(--line); border-radius:25px; background:var(--white); box-shadow:var(--shadow); }
        .card-top { display:flex; align-items:center; gap:16px; padding:24px 32px; color:var(--white); background:var(--ink); }
        .card-icon { width:48px; height:48px; display:grid; place-items:center; flex:0 0 auto; border-radius:14px 14px 14px 5px; color:var(--ink); background:var(--yellow); font-size:1.1rem; font-weight:900; }
        .card-top h2 { margin:0 0 1px; font-size:1.08rem; font-weight:900; }
        .card-top p { margin:0; color:rgba(255,255,255,.55); font-size:.74rem; }
        .edit-form { padding:34px 36px 38px; }
        .field { margin-bottom:22px; }
        .field-label { display:block; margin-bottom:7px; font-size:.78rem; font-weight:900; }
        .field-hint { display:block; margin-top:6px; color:#999087; font-size:.7rem; }
        .form-input,.form-textarea { width:100%; border:1px solid var(--line); border-radius:13px; outline:none; background:var(--white); transition:.2s ease; }
        .form-input { height:52px; padding:0 15px; }
        .form-textarea { min-height:180px; padding:13px 15px; resize:vertical; }
        .rating-row { display:grid; grid-template-columns:150px 1fr; gap:15px; align-items:center; }
        .rating-preview { color:var(--yellow); font-size:1.2rem; letter-spacing:.08em; }
        .form-input:focus,.form-textarea:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(255,92,53,.1); }
        .form-actions { display:flex; gap:10px; margin-top:30px; }
        .update-button,.cancel-button { min-height:50px; display:inline-flex; align-items:center; justify-content:center; padding:8px 22px; border-radius:13px; font-size:.84rem; font-weight:900; transition:.2s ease; }
        .update-button { flex:1; border:0; color:var(--white); background:var(--ink); }
        .update-button:hover { background:var(--accent); transform:translateY(-1px); }
        .cancel-button { color:var(--muted); border:1px solid var(--line); background:var(--white); text-decoration:none; }
        .cancel-button:hover { color:var(--ink); border-color:#bbb2a8; }

        @media (max-width:900px) {
            .main-nav { overflow-x:auto; scrollbar-width:none; }
            .main-nav::-webkit-scrollbar { display:none; }
            .logout { display:none; }
        }
        @media (max-width:720px) {
            .header-inner,.page-wrap { width:min(100% - 28px,920px); }
            .header-inner { min-height:auto; display:grid; grid-template-columns:1fr auto; gap:10px; padding:11px 0 8px; }
            .main-nav { grid-column:1 / -1; grid-row:2; margin:0 -4px; padding:0 4px 3px; }
            .header-actions { grid-column:2; grid-row:1; }
            .page-wrap { padding-top:29px; }
            .page-heading { display:block; }
            .back-link { display:inline-flex; margin-top:14px; }
            .card-top { padding:20px; }
            .edit-form { padding:27px 21px 30px; }
            .rating-row { grid-template-columns:1fr; gap:8px; }
            .form-actions { display:grid; }
            .cancel-button { grid-row:2; }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="header-inner">
            <a href="{{ url_for('main.index') }}" class="brand"><span class="brand-mark">M</span><span>漫画感想アプリ</span></a>
            <nav class="main-nav" aria-label="メインメニュー">
                <a href="{{ url_for('main.index') }}" class="nav-item-custom">ホーム</a>
                <a href="{{ url_for('main.profile', user_id=current_user.id) }}" class="nav-item-custom">プロフィール</a>
                <a href="{{ url_for('main.rating_ranking') }}" class="nav-item-custom">評価ランキング</a>
                <a href="{{ url_for('main.ranking') }}" class="nav-item-custom">いいねランキング</a>
            </nav>
            <div class="header-actions">
                <a href="{{ url_for('main.create_post') }}" class="new-post">投稿する</a>
                <a href="{{ url_for('main.logout') }}" class="logout">ログアウト</a>
            </div>
        </div>
    </header>

    <main class="page-wrap">
        <div class="page-heading">
            <div><p class="eyebrow">Edit review</p><h1>投稿の編集</h1></div>
            <a href="{{ url_for('main.index') }}" class="back-link">← 投稿一覧へ戻る</a>
        </div>

        <section class="edit-card">
            <div class="card-top">
                <span class="card-icon">E</span>
                <div><h2>投稿内容を更新</h2><p>タイトル・感想・評価を編集できます。</p></div>
            </div>

            <form method="POST" action="{{ url_for('main.update', id=book.id) }}" class="edit-form">
                <div class="field">
                    <label for="title" class="field-label">タイトル</label>
                    <input id="title" type="text" name="title" value="{{ book.title }}" required class="form-input">
                </div>

                <div class="field">
                    <label for="review" class="field-label">感想</label>
                    <textarea id="review" name="review" required class="form-textarea" rows="6">{{ book.review }}</textarea>
                </div>

                <div class="field">
                    <label for="rating" class="field-label">評価</label>
                    <div class="rating-row">
                        <input id="rating" type="number" name="rating" min="1" max="5" value="{{ book.rating }}" required class="form-input">
                        <span class="rating-preview" aria-hidden="true">★★★★★</span>
                    </div>
                    <span class="field-hint">1〜5の数字で評価してください。</span>
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('main.index') }}" class="cancel-button">キャンセル</a>
                    <button type="submit" class="update-button">変更を更新</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
