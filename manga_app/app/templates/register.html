<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171513">
    <title>ユーザー登録 | 漫画感想アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root { --ink:#171513; --muted:#6b655f; --paper:#f7f5f1; --white:#fff; --line:#e7e1d9; --accent:#ff5c35; --accent-pale:#fff0eb; --yellow:#ffbd2e; }
        * { box-sizing:border-box; }
        body { min-width:320px; min-height:100vh; margin:0; color:var(--ink); background:var(--paper); font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif; }
        .auth-page { min-height:100vh; display:grid; grid-template-columns:minmax(370px,.85fr) minmax(480px,1.15fr); }
        .visual-panel { position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:52px; color:var(--white); background:var(--ink); }
        .visual-panel::before { content:""; position:absolute; top:-150px; right:-160px; width:440px; height:440px; border:70px solid rgba(255,255,255,.04); border-radius:50%; }
        .visual-panel::after { content:""; position:absolute; inset:0; opacity:.12; background-image:radial-gradient(#fff 1px,transparent 1px); background-size:15px 15px; mask-image:linear-gradient(145deg,transparent 28%,#000 100%); }
        .brand,.visual-copy,.visual-note { position:relative; z-index:1; }
        .brand { display:inline-flex; align-items:center; gap:12px; width:fit-content; color:var(--white); text-decoration:none; font-size:1.08rem; font-weight:900; letter-spacing:-.04em; }
        .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:13px 13px 13px 4px; color:var(--white); background:var(--accent); box-shadow:4px 4px 0 var(--yellow); font-family:Georgia,serif; font-size:1.4rem; }
        .eyebrow { margin:0 0 14px; color:var(--yellow); font-size:.7rem; font-weight:900; letter-spacing:.17em; }
        .visual-copy h1 { max-width:500px; margin:0; font-size:clamp(2.5rem,5vw,4.7rem); font-weight:900; line-height:1.14; letter-spacing:-.07em; }
        .visual-copy p { max-width:440px; margin:20px 0 0; color:rgba(255,255,255,.58); font-size:.94rem; line-height:1.9; }
        .visual-note { color:rgba(255,255,255,.38); font-size:.72rem; letter-spacing:.08em; }
        .form-panel { display:grid; place-items:center; padding:52px 7vw; background:radial-gradient(circle at 100% 0%,rgba(255,92,53,.12),transparent 25rem),var(--paper); }
        .form-wrap { width:min(100%,440px); }
        .mobile-brand { display:none; }
        .form-kicker { margin:0 0 5px; color:var(--accent); font-size:.7rem; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
        .form-title { margin:0; font-size:clamp(2rem,4vw,2.8rem); font-weight:900; letter-spacing:-.06em; }
        .form-lead { margin:9px 0 28px; color:var(--muted); font-size:.86rem; }
        .error-box { margin-bottom:18px; padding:12px 14px; border:1px solid #ffc8ba; border-radius:12px; color:#b93619; background:var(--accent-pale); font-size:.82rem; font-weight:700; }
        .field { margin-bottom:18px; }
        .field-label { display:block; margin-bottom:7px; color:#403b37; font-size:.78rem; font-weight:900; }
        .field-hint { display:block; margin-top:6px; color:#999087; font-size:.7rem; }
        .form-input { width:100%; height:54px; padding:0 16px; border:1px solid var(--line); border-radius:13px; outline:none; background:var(--white); transition:.2s ease; }
        .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(255,92,53,.1); }
        .submit-button { width:100%; min-height:54px; margin-top:5px; border:0; border-radius:13px; color:var(--white); background:var(--ink); font-weight:900; box-shadow:0 12px 25px rgba(23,21,19,.15); transition:.2s ease; }
        .submit-button:hover { background:var(--accent); transform:translateY(-1px); box-shadow:0 14px 28px rgba(255,92,53,.2); }
        .switch-page { margin:22px 0 0; color:var(--muted); text-align:center; font-size:.82rem; }
        .switch-page a { color:var(--accent); font-weight:900; text-decoration:none; }
        .switch-page a:hover { color:#df421f; text-decoration:underline; }

        @media (max-width:820px) {
            .auth-page { grid-template-columns:1fr; }
            .visual-panel { display:none; }
            .form-panel { min-height:100vh; padding:35px 22px; }
            .mobile-brand { display:inline-flex; align-items:center; gap:10px; margin-bottom:60px; color:var(--ink); text-decoration:none; font-size:1rem; font-weight:900; }
            .mobile-brand .brand-mark { width:36px; height:36px; color:var(--white); box-shadow:4px 4px 0 var(--ink); font-size:1.15rem; }
        }
    </style>
</head>

<body>
    <main class="auth-page">
        <section class="visual-panel" aria-label="漫画感想アプリについて">
            <a href="#" class="brand"><span class="brand-mark">M</span><span>漫画感想アプリ</span></a>

            <div class="visual-copy">
                <p class="eyebrow">JOIN THE COMMUNITY</p>
                <h1>好きな一冊が、会話のきっかけになる。</h1>
                <p>アカウントを作って、心に残った漫画とその感想を自分らしく記録しましょう。</p>
            </div>

            <span class="visual-note">READ. REVIEW. DISCOVER.</span>
        </section>

        <section class="form-panel">
            <div class="form-wrap">
                <a href="#" class="mobile-brand"><span class="brand-mark">M</span><span>漫画感想アプリ</span></a>
                <p class="form-kicker">Create account</p>
                <h2 class="form-title">ユーザー登録</h2>
                <p class="form-lead">最初にログイン用の情報を登録します。</p>

                {% if error %}
                    <div class="error-box" role="alert">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <div class="field">
                        <label for="username" class="field-label">ユーザー名</label>
                        <input id="username" type="text" name="username" class="form-input" autocomplete="username" placeholder="ユーザー名を入力" required autofocus>
                        <span class="field-hint">投稿者名として使用されます。</span>
                    </div>

                    <div class="field">
                        <label for="password" class="field-label">パスワード</label>
                        <input id="password" type="password" name="password" class="form-input" autocomplete="new-password" placeholder="パスワードを入力" required>
                    </div>

                    <button type="submit" class="submit-button">アカウントを作成</button>
                </form>

                <p class="switch-page">すでにアカウントをお持ちの方は <a href="{{ url_for('main.login') }}">ログイン</a></p>
            </div>
        </section>
    </main>
</body>
</html>
